services:
  - type: web
    name: nile-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: RUNWAY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
